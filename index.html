<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiceDirect | Office Group Orders</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f5; color: #1b4332; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; border-radius: 12px; padding: 20px; max-width: 400px; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #d8e2dc; }
        h1 { color: #2d6a4f; margin: 0 0 5px 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        input[type="text"], select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #d8e2dc; border-radius: 6px; font-size: 1rem; }
        button { width: 100%; background-color: #2d6a4f; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🌾 RiceDirect</h1>
        <p>Premium Rayalaseema Sona Masoori Rice (25kg Bag) direct from farmers at wholesale rates.</p>
        <hr style="border:0; border-top:1px solid #d8e2dc; margin: 20px 0;">
        
        <form onsubmit="event.preventDefault(); sendOrder();">
            <div class="form-group">
                <label>Select Rice Type:</label>
                <select id="polish">
                    <option value="Polished (Fine Grain)">✨ Polished Rice</option>
                    <option value="Unpolished (Raw/High Fiber)">🌾 Unpolished Raw Rice</option>
                </select>
            </div>

            <div class="form-group">
                <label>Quantity (Bags):</label>
                <select id="quantity">
                    <option value="1">1 Bag (25 kg)</option>
                    <option value="2">2 Bags (50 kg)</option>
                    <option value="3">3 Bags (75 kg)</option>
                    <option value="4">4 Bags (100 kg)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Your Full Name:</label>
                <input type="text" id="name" placeholder="Enter name" required>
            </div>

            <div class="form-group">
                <label>Office Delivery Location / Desk:</label>
                <input type="text" id="location" placeholder="e.g., Floor 4, Desk 412" required>
            </div>

            <button type="submit">🚀 Place Order via WhatsApp</button>
        </form>
    </div>

    <script>
        function sendOrder() {
            var name = document.getElementById('name').value;
            var polish = document.getElementById('polish').value;
            var quantity = document.getElementById('quantity').value;
            var location = document.getElementById('location').value;

            var txt = "🌾 NEW RICE DIRECT ORDER 🌾\n\n" +
                      "Name: " + name + "\n" +
                      "Product: Rayalaseema Sona Masoori (25kg Bag)\n" +
                      "Type: " + polish + "\n" +
                      "Quantity: " + quantity + " Bag(s)\n" +
                      "Office Desk: " + location + "\n\n" +
                      "Please confirm order processing.";

            var encodedText = encodeURIComponent(txt);
            var targetUrl = "https://whatsapp.com" + encodedText;
            
            window.location.href = targetUrl;
        }
    </script>
</body>
</html>
